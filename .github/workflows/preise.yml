name: Strompreise holen

on:
  schedule:
    - cron: "7 * * * *"      # stündlich, zur Minute 7
  workflow_dispatch:          # zusätzlich von Hand startbar

permissions:
  contents: write

jobs:
  holen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Preise von Energy-Charts laden
        run: |
          START=$(TZ=Europe/Berlin date -d "3 days ago" +%F)
          END=$(TZ=Europe/Berlin date -d "tomorrow" +%F)
          curl -fsS --retry 3 "https://api.energy-charts.info/price?bzn=DE-LU&start=${START}&end=${END}" -o neu.json
          python3 -c "import json; d = json.load(open('neu.json')); assert len(d['price']) > 24"
          mv neu.json preise.json

      - name: Geänderte Preise ins Repository schreiben
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add preise.json
          git diff --cached --quiet || git commit -m "Strompreise aktualisiert"
          git push
